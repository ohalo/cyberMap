<!-- A2 空状态 -->
<text x="346" y="24" class="cap">A2 首页 · 空状态</text>
<text x="346" y="39" class="capsub">扫描自动发现 / 手动添加</text>
<rect x="346" y="50" width="296" height="402" rx="25" class="frame"/>
<rect x="353" y="57" width="282" height="388" rx="19" class="screen"/>
<rect x="353" y="57" width="282" height="32" rx="19" class="bar"/>
<text x="366" y="77" class="status">9:41</text>
<text x="610" y="77" class="status">▮▮▮ ⌁</text>
<text x="366" y="111" class="title">SysControl</text>
<g class="icon" transform="translate(584,99)"><path d="M9 0a9 9 0 1 0 7.8 4.5"/><path d="M17 0v5h-5"/></g>
<g class="icon" transform="translate(610,99)"><path d="M10 2v16M2 10h16"/></g>

<circle cx="494" cy="238" r="46" fill="none" stroke="#4285f4" stroke-width="1.6" opacity=".75"/>
<circle cx="494" cy="238" r="29" fill="none" stroke="#4285f4" stroke-width="1.6" opacity=".75"/>
<path d="M494 238 L524 208" fill="none" stroke="#4285f4" stroke-width="1.7" opacity=".8"/>
<circle cx="494" cy="238" r="5" fill="#1a73e8"/>
<circle cx="524" cy="208" r="4" fill="#34a853"/>
<text x="494" y="322" text-anchor="middle" class="empty-title">还没有设备</text>
<text x="494" y="343" text-anchor="middle" class="empty-desc">让手机和电脑在同一个局域网，</text>
<text x="494" y="359" text-anchor="middle" class="empty-desc">然后扫描自动发现，或手动添加设备。</text>
<rect x="366" y="382" width="130" height="32" rx="8" class="btn-blue"/>
<text x="431" y="402" text-anchor="middle" class="btn-blue-txt">扫描设备</text>
