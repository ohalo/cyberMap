<text x="567" y="402" text-anchor="middle" class="btn-white-txt">手动添加</text>

<!-- A3 添加设备弹窗 -->
<text x="672" y="24" class="cap">A3 添加设备 · 配对弹窗</text>
<text x="672" y="39" class="capsub">系统类型自动识别 · Token 高亮</text>
<rect x="672" y="50" width="296" height="402" rx="25" class="frame"/>
<rect x="679" y="57" width="282" height="388" rx="19" class="screen"/>
<rect x="679" y="57" width="282" height="32" rx="19" class="bar"/>
