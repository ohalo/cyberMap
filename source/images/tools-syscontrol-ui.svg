<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470" width="1320" height="470" role="img" aria-label="SysControl 安卓端界面：设备列表、空状态、添加设备弹窗、扫描发现，依据 Ardot 设计稿绘制">
<title>SysControl 安卓端界面（依据 Ardot 设计稿 751570775043642 绘制）</title>
<style>
  .frame{fill:#fff;stroke:#dadce0;stroke-width:1.6}
  .screen{fill:#fafbfe}
  .status{font-family:Arial,sans-serif;font-size:10px;font-weight:700;fill:#202124}
  .bar{fill:#fff}
  .title{font-family:Arial,sans-serif;font-size:14.5px;font-weight:700;fill:#202124}
  .icon{fill:none;stroke:#5f6368;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .count{font-family:Arial,sans-serif;font-size:10px;fill:#188038;font-weight:600}
  .card{fill:#fff;stroke:#e3e7ed;stroke-width:1.2}
  .cname{font-family:Arial,sans-serif;font-size:11.5px;font-weight:700;fill:#202124}
  .os{font-family:Arial,sans-serif;font-size:9px;font-weight:600;fill:#1a73e8}
  .meta{font-family:Arial,sans-serif;font-size:9px;fill:#5f6368}
  .online{font-family:Arial,sans-serif;font-size:9px;fill:#188038}
  .offline{font-family:Arial,sans-serif;font-size:9px;fill:#9aa0a6}
  .dot{fill:#34a853}.dotoff{fill:#9aa0a6}
  .btn-outline{fill:#fff;stroke:#4285f4;stroke-width:1.1}
  .btn-outline-txt{font-family:Arial,sans-serif;font-size:9.5px;font-weight:600;fill:#1a73e8}
  .del{font-family:Arial,sans-serif;font-size:9.5px;fill:#ea4335}
  .cta{fill:#ea4335}.cta-txt{font-family:Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff}
  .empty-title{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#202124}
  .empty-desc{font-family:Arial,sans-serif;font-size:10.5px;fill:#5f6368}
  .btn-blue{fill:#1a73e8}.btn-blue-txt{font-family:Arial,sans-serif;font-size:10.5px;font-weight:700;fill:#fff}
  .btn-white{fill:#fff;stroke:#dadce0;stroke-width:1.1}
  .btn-white-txt{font-family:Arial,sans-serif;font-size:10.5px;font-weight:600;fill:#3c4043}
  .mask{fill:#202124;opacity:.42}
  .dlg{fill:#fff;stroke:#dadce0;stroke-width:1.4}
  .dlgt{font-family:Arial,sans-serif;font-size:13.5px;font-weight:700;fill:#202124}
  .label{font-family:Arial,sans-serif;font-size:9.5px;font-weight:600;fill:#5f6368}
  .field{fill:#f8f9fc;stroke:#dadce0;stroke-width:1.1}
  .value{font-family:Arial,sans-serif;font-size:10px;fill:#3c4043}
  .ph{font-family:Arial,sans-serif;font-size:9.5px;fill:#9aa0a6}
  .auto{fill:#e6f4ea}.auto-txt{font-family:Arial,sans-serif;font-size:8.8px;font-weight:600;fill:#188038}
  .token-field{fill:#fff;stroke:#1a73e8;stroke-width:1.5}
  .cancel{font-family:Arial,sans-serif;font-size:10px;font-weight:600;fill:#5f6368}
  .save{fill:#1a73e8}.save-txt{font-family:Arial,sans-serif;font-size:10px;font-weight:700;fill:#fff}
  .tip{fill:#e8f0fe}.tip-txt{font-family:Arial,sans-serif;font-size:9px;fill:#1a73e8}
  .disc{font-family:Arial,sans-serif;font-size:9.5px;font-weight:600;fill:#188038}
  .sec{font-family:Arial,sans-serif;font-size:10px;font-weight:600;fill:#3c4043}
  .cap{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#45526b}
  .capsub{font-family:Arial,sans-serif;font-size:10px;fill:#6b7790}
