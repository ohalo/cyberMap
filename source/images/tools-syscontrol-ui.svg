<text x="47" y="286" class="meta">192.168.133.50:5090</text>
<rect x="47" y="293" width="52" height="20" rx="10" class="btn-outline"/>
<text x="73" y="307" text-anchor="middle" class="btn-outline-txt">关机</text>
<text x="276" y="307" text-anchor="end" class="del">删除</text>

<rect x="36" y="327" width="264" height="86" rx="9" class="card"/>
