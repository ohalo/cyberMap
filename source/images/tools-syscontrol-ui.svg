<text x="276" y="214" text-anchor="end" class="del">删除</text>

<rect x="36" y="234" width="264" height="86" rx="9" class="card"/>
<text x="47" y="254" class="cname">Mac mini</text>
<text x="47" y="267" class="os">macOS</text>
<circle cx="283" cy="250" r="3.4" class="dotoff"/>
