  enable: false
  position: sidebar # 'footer','sidebar'
  pv: 本站总访问量$pv
  uv: 本站总访客数$uv

custom:
  head:
    |- # 以下内容插入到<head></head>标签内，可设置多行，注意每行开头至少四个空格
    <!-- cyberMap 重设计样式：主题目录是 submodule，所有自定义样式从这里注入 -->
    <link rel="stylesheet" href="/css/cybermap.css">
    <!-- canonical 按当前路径动态生成：custom.head 全站共享，写死会把归档页/文章页都指向首页 -->
    <script>
    (function () {
      var p = location.pathname.replace(/index\.html$/, '');
      var canonical = 'https://cybermap.halo26812.eu.org' + p;
      var link = document.createElement('link');
      link.rel = 'canonical';
      link.href = canonical;
      document.head.appendChild(link);
      var og = document.querySelector('meta[property="og:url"]');
      if (og) og.setAttribute('content', canonical);
    })();
    </script>
    <!-- hreflang: 中英双语互指。仅首页有完整译文对，内页无译文只声明 x-default 回首页 -->
    <script>
    (function () {
      var base = 'https://cybermap.halo26812.eu.org';
      var p = location.pathname.replace(/index\.html$/, '').replace(/\/+$/, '') || '/';
      var pairs = p === '/'
        ? [['zh-CN', base + '/'], ['en', base + '/en/'], ['x-default', base + '/']]
        : [['x-default', base + '/']];
      pairs.forEach(function (pair) {
        var l = document.createElement('link');
        l.rel = 'alternate'; l.hreflang = pair[0]; l.href = pair[1];
        document.head.appendChild(l);
      });
    })();
    </script>
    <link rel="alternate" type="application/rss+xml" title="cyberMap 每日 AI 速递" href="/daily/feed.xml">
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"WebSite","name":"cyberMap","url":"https://cybermap.halo26812.eu.org/","description":"每日更新的 AI 工具与开源项目导航，附 AI 插件排行榜与每日 AI 速递。","inLanguage":"zh-CN"}
    </script>
    <!-- 站长平台验证位：把 GSC / Bing / 百度提供的 <meta name="..."> 粘贴到这一行下方 -->
  body: |- # 以下内容插入到</body>标签之前，可设置多行，注意每行开头至少四个空格
    <!-- cyberMap 重设计交互增强 -->
    <script src="/js/cybermap.js"></script>
    <!-- 可设置多行 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YGLB3LVYFC"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    
    gtag('config', 'G-YGLB3LVYFC');
    </script>


