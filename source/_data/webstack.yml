about:
  url: /about/
  icon: far fa-heart
  name: 关于本站

aboutPage:
  website:
    head: 关于本站
    html: '<p>cyberMap 是一个每日更新的 AI 工具与开源项目导航站，收录大模型、智能体、开发框架与实用站点，帮助你在快速变化的 AI 生态里快速找到值得关注的项目。</p><blockquote><p><strong>每日 AI 速递</strong>：每天核验并收录真实可访问的 AI 站点，按开源项目 / 工具官网 / 模型框架分类，并附<strong>质量回执</strong>（HTTP 状态、GitHub stars、AI 命中证据）。支持 <a href="/daily/feed.xml">RSS 订阅</a>与方向标签筛选。</p><p><strong>AI 插件排行榜</strong>：<a href="/rank/">/rank/</a> 按公开可核验的 GitHub 数据为 AI Agent 插件生态排名，评分口径完全公开、可复算可回溯。</p></blockquote>'
  webmaster:
    head: 关于站长与联系
    name: ohalo
    url: https://github.com/ohalo
    img: /images/logos/myblog.png
    description: 开源爱好者
    html: '<br /><blockquote><p>本站源码开放于 <a href="https://github.com/ohalo/cyberMap">github.com/ohalo/cyberMap</a>。如发现失效链接、错误收录或有收录建议，欢迎提交 Issue 或 Discussion。</p><p>本站由 <a href="https://hexo.io/">Hexo</a> 驱动，使用 <a href="https://github.com/HCLonely/hexo-theme-webstack">hexo-theme-webstack</a> 主题，部署在 Vercel。</p></blockquote>'

since: 2023

